name: Keep Supabase Awake

on:
  schedule:
    # ทุก 5 วัน เวลา 03:00 UTC (~10:00 เวลาไทย) — Supabase free tier pause หลังไม่มีการใช้งาน 7 วัน
    - cron: "0 3 */5 * *"
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions บน GitHub เพื่อทดสอบ

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/sim_state?select=actor&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -ge 400 ]; then
            echo "::warning::Supabase ping ได้ HTTP $STATUS — ตรวจสอบ project ว่ายัง active อยู่"
          fi
